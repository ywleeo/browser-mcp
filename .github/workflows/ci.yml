name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        if: runner.os == 'Linux'
        run: uv run pyright

      - name: Test
        if: runner.os != 'Windows'
        run: uv run pytest -q

      # These suites exercise POSIX process probes and signals. Keep the Windows
      # stdio smoke test independent of the POSIX owner watchdog as well.
      - name: Test Windows-compatible Python paths
        if: runner.os == 'Windows'
        env:
          BROWSER_MCP_OWNER_PID: '0'
        run: uv run pytest -q --ignore=tests/test_bridge_registry.py --ignore=tests/test_process_lifecycle.py

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Test Chrome extension
        run: npm test

  windows-occlusion:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Download Chrome for Testing
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json
          $release = $manifest.channels.Stable
          $download = $release.downloads.chrome | Where-Object platform -eq win64
          Write-Host "Chrome for Testing $($release.version)"
          $archive = Join-Path $env:RUNNER_TEMP 'chrome.zip'
          curl.exe --fail --silent --show-error --retry 3 --output $archive $download.url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          "BROWSER_MCP_TEST_CHROME=$env:RUNNER_TEMP\chrome-win64\chrome.exe" >> $env:GITHUB_ENV

      - name: Compare actual Chrome input behind a native window
        run: uv run --locked python -u .github/scripts/windows_occlusion.py
