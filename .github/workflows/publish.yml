name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted Publishing mints a short-lived OIDC token instead of a stored API token.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check tag matches package version
        id: version
        shell: bash
        run: |
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "package=${PKG_VERSION}"
          echo "tag=${TAG_VERSION}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package version ($PKG_VERSION) != tag ($TAG_VERSION). Bump pyproject.toml to match and re-tag."
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
